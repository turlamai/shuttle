name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Do not cancel required evidence for previous main commits; only superseded
# PR revisions can cancel one another.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Single source of truth for the rivet pin: release builds pin, local
# development tracks the linked checkout.
env:
  RIVET_PIN: 5d8b244f93d00e68b39376115a43f047a2733a85

jobs:
  windows:
    name: Windows (x64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Racket CS
        uses: Bogdanp/setup-racket@v1.15
        with:
          architecture: x64
          distribution: full
          variant: CS
          version: '9.3'
      - name: Install Rivet (pinned, with keel below the tests/documentation collision)
        shell: pwsh
        run: |
          raco pkg install --auto --no-docs 'https://github.com/turlamai/keel.git#76a5b9fdd01bde284d310ff5c05ec73972f64201'
          raco pkg install --auto --no-docs 'https://github.com/turlamai/rivet.git#${{ env.RIVET_PIN }}'
      - name: Verify independent Windows publisher and update-signing contracts
        shell: bash
        run: |
          set -euo pipefail
          workflow=.github/workflows/release.yml
          grep -Fq 'run: raco rivet release --development' "$workflow"
          if grep -Eq -- '--without-updates|RIVET_WINDOWS_SIGN_' "$workflow"; then
            echo "::error::Shuttle must retain signed MSI updates without requiring an Authenticode certificate"
            exit 1
          fi
          grep -Fq 'secrets.UPDATE_ED25519_PRIVATE_KEY' "$workflow"
          grep -Fq 'openssl pkey -inform DER' "$workflow"
          grep -Fq 'RIVET_UPDATE_PRIVATE_KEY:' "$workflow"
          grep -Fq 'RIVET_UPDATE_KEY_ID: update-2026-10' "$workflow"
          grep -Fq 'dist/update-stable.json' "$workflow"
          grep -Fq 'for pattern in *.zip *.msi *.sha256 update-stable.json' "$workflow"
          grep -Fq 'not Authenticode-signed' "$workflow"
      - name: Schema contract gate
        run: raco rivet schema check rivet-schema.json --json
      # The runner's MSVC toolchain is the release compiler; local
      # machines without Build Tools stay green through this job. Plain
      # output so MSVC/XAML errors land directly in the log.
      - name: Native build (WinUI 3 host)
        run: raco rivet build
      - name: Backend engine tests (pure units)
        run: raco test app/backend.rkt
      # The full send→receive→sweep chain against a synthetic mailbox —
      # hermetic since the acceptance rework, so CI exercises it too.
      - name: Mailbox chain (bridge)
        run: racket -l racket/base -e '(require (submod "app/backend.rkt" test)) (test-main)'
      # Release-kind update evidence: signed-feed rejection, N→N+1
      # lifecycle, data preservation, flavor artifact selection.
      - name: Release update suite
        run: racket scripts/acceptance/release-update.rkt
